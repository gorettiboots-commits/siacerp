; ============================================================
; SIAC ERP — Configuracion de Code Signing (ejemplo)
; ============================================================
; Copia este archivo como "sign_config.ini" y ajusta los valores.
; NUNCA subas sign_config.ini a git (contiene credenciales).
;
; Requisitos:
;   1. Certificado de firma de codigo Authenticode (.pfx)
;   2. signtool.exe (incluido en Windows SDK o Visual Studio)
;   3. Inno Setup 6.x
;
; Donde obtener un certificado:
;   - Sectigo: https://sectigo.com/store/code-signing-certificates
;   - DigiCert: https://www.digicert.com/code-signing
;   - GlobalSign: https://www.globalsign.com/code-signing-certificate
;   - Certum (economico): https://www.certum.eu/opensource/
;
; NOTA: Los certificados de privada remota (HSM) NO funcionan
;       con Inno Setup. Necesitas un .pfx local.
; ============================================================

; Ruta completa al archivo .pfx del certificado
certificate=C:\certificados\siac_erp_signing.pfx

; Contrasena del certificado .pfx
password=MiContrasenaSegura123

; Servidor de timestamp (opcional, tiene valor por defecto)
; timestamp=http://timestamp.sectigo.com
