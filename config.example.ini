[database]
; Modo de base de datos: sqlite o postgresql
engine = sqlite

; Configuración SQLite
sqlite_path = goretti_erp.db

; Configuración PostgreSQL (solo si engine = postgresql)
pg_host = localhost
pg_port = 5432
pg_user = postgres
pg_password = CAMBIAR_POR_CREDENCIALES_REALES
pg_database = goretti_erp

[app]
company_name = SIAC
app_title = SIAC ERP
version = 1.0.0

[supabase]
; URL del proyecto y anon key (app móvil -> cola de impresión)
url =
anon_key =

; ID de empresa (UUID) para multi-tenant.
; Cada instancia del ERP tiene su propia empresa.
; Generar con: python -c "import uuid; print(uuid.uuid4())"
empresa_id =
